services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artemis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artemis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artemis} -d ${POSTGRES_DB:-artemis}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artemis:
    image: ghcr.io/francesco-oghabi/artemis:${ARTEMIS_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEMIS_PG_DSN: postgres://${POSTGRES_USER:-artemis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artemis}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEMIS_LLM_PROVIDER: ${ARTEMIS_LLM_PROVIDER:-}
      ARTEMIS_LLM_MODEL: ${ARTEMIS_LLM_MODEL:-}
      ARTEMIS_LLM_BASE_URL: ${ARTEMIS_LLM_BASE_URL:-}
      ARTEMIS_LLM_PROXY: ${ARTEMIS_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      # Bind the data directory (containing jwt.key, SQLite, etc.) to data/ in the project root,
      # so it can be inspected/backed up directly on the host and survives container rebuilds.
      - ./data:/app/data
      # Mount the project root's skills into the container (overriding the image's built-in /app/skills);
      # editing a skill needs no image rebuild, the container reads this copy on the host.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
