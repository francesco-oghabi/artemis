# Bersaglio di test volutamente vulnerabile: OWASP Juice Shop.
# Non fa parte di OpenArtemis: e' un target isolato usato per il benchmark
# di rilevamento (modello locale vs modello a pagamento).
#
# IMPORTANTE: il container si aggancia alla rete di OpenArtemis (artemis_default)
# e OpenArtemis lo raggiunge per NOME CONTAINER:  http://juice-shop:3000
# NON usare host.docker.internal: coincide con l'host del gateway LLM (Ollama)
# e fa scattare il guard P0-1 di OpenArtemis (server.go:1270), che rifiuta il
# target e blocca le chiamate ("Operation not allowed").
#
# Avvio:   docker compose -f targets/juice-shop/docker-compose.yml up -d
# Stop:    docker compose -f targets/juice-shop/docker-compose.yml down
# La porta 3000 e' esposta anche sull'host solo per verifica/debug.
#
# La tag va pinnata a una versione precisa per rendere il benchmark
# ripetibile: update the digest and note the new version when bumping it.
services:
  juice-shop:
    # Pinnato al digest per ripetibilita' del benchmark (versione 20.4.0-SNAPSHOT).
    # Per aggiornare: sostituire il digest e annotare la nuova versione nel registro.
    image: bkimminich/juice-shop@sha256:877fc77b12d72b42e486eb09b6b1711cc56514306d92006b284e7e7cf076a809
    container_name: juice-shop
    ports:
      - "3000:3000"
    networks:
      - artemis_default
    restart: unless-stopped

networks:
  artemis_default:
    external: true
