# Inference concurrency on the Ollama side.
# Number of sequences (slots) a single loaded model serves in parallel.
# Align it to Artemis's concurrent workers (settings.workers): for real
# parallelism you need OLLAMA_NUM_PARALLEL >= workers, otherwise extra workers'
# requests queue serially on Ollama.
#
# VRAM cost: one KV cache per slot. On Qwen3-Coder-30B-A3B (GQA, 4 KV heads,
# 48 layers, head_dim 64) at num_ctx 32768 that is ~1.5 GB/slot in f16, so 2
# slots fit comfortably in a 32 GB GPU (Q4_K_M weights ~18-19 GB + 2x1.5 GB KV).
# See deploy/ollama/README.md for the math and rationale.
[Service]
Environment="OLLAMA_NUM_PARALLEL=2"
