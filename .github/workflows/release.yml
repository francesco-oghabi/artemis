name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the Release

jobs:
  # 1) Frontend static export (once); the artifact is reused by the cross-compiled builds for every platform
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Stamp version from tag  # the frontend version is injected automatically from the release tag, not hardcoded
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # 2) Cross-compile for five platforms (with embedded frontend) + package as zip
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BIN=artemis
          [ "$GOOS" = "windows" ] && BIN=artemis.exe
          # Embed the skill library (report-generation is generated by the Go side's SeedSkillFiles, so it is excluded)
          mkdir -p server/skillsdist && cp -r skills/. server/skillsdist/ && rm -rf server/skillsdist/report-generation
          go build -tags embedui -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$BIN" ./cmd/artemis
      - name: Package
        run: |
          NAME="artemis-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$NAME"
          cp -r skills "$NAME"/
          cp config.example.json "$NAME"/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp artemis.exe "$NAME"/
          else
            cp artemis "$NAME"/
            cp start.sh "$NAME"/                                  # supervisor startup script (required by the "one-click update" page)
            mkdir -p "$NAME/deploy" && cp deploy/artemis.service "$NAME/deploy"/  # systemd template
          fi
          zip -r "$NAME.zip" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.zip"
      # Upload the raw Linux binaries separately for the docker job to reuse (avoids recompiling frontend + Go inside the image)
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: artemis

  # 3) Collect all zips -> create the GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # fetch CHANGELOG.md to use as the release notes
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      # Checksum manifest: after the one-click self-update (selfupdate package) downloads, it verifies SHA256 against this; installation is refused if it is missing.
      # File names use the basename (sha256sum is generated inside dist/), consistent with selfupdate.AssetName.
      - name: Generate SHA256SUMS
        run: cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
      # A concise "what's new": take the topmost version section of the CHANGELOG as the release body.
      - name: Extract release notes
        run: |
          awk '/^## /{n++} n==1{print}' CHANGELOG.md | tail -n +2 > RELEASE_NOTES.md
          echo "--- release notes ---"; cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md

  # 4) Multi-arch image -> push to GHCR (reuses the Linux binaries built by the binaries job;
  #    the image only installs tools + drops in the binary; arm64 only emulates the apt layer, so builds are much faster)
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4 # fetch the Dockerfile and skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/francesco-oghabi/artemis
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
